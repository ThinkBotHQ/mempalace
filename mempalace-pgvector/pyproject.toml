[project]
name = "mempalace-pgvector"
version = "0.1.0"
description = "PostgreSQL + pgvector storage backend for MemPalace"
requires-python = ">=3.10"
dependencies = [
    "mempalace>=3.3,<5.0",
    "psycopg[binary]>=3.2.0,<4.0",
    "psycopg-pool>=3.2.0,<4.0",
    "pgvector>=0.3.6,<1.0",
    "google-genai>=0.8.0,<2.0",
    "tenacity>=8.2.0,<10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mempalace_pgvector"]

[tool.ruff]
line-length = 100
