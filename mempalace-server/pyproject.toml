[project]
name = "mempalace-server"
version = "0.1.0"
description = "Remote MCP server for MemPalace — shared multi-tenant memories over HTTP"
requires-python = ">=3.10"
dependencies = [
    "mempalace>=3.3,<5.0",
    "mempalace-pgvector>=0.1,<1.0",
    "mcp>=1.0,<3.0",
    "starlette>=1.0,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "psycopg[binary]>=3.2.0,<4.0",
]

[tool.uv.sources]
mempalace = { path = ".." }
mempalace-pgvector = { path = "../mempalace-pgvector" }

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
mempalace-server = "mempalace_server.app:main"
mempalace-api-key = "mempalace_server.keys_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mempalace_server"]

[tool.ruff]
line-length = 100
